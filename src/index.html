<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Alpha" />
    <meta name="keywords" content="social media, aroundtheus" />
    <meta
      name="description"
      content="a website that mimics a social media picture sharing app"
    />
    <title>Around the U.S.</title>
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header">
        <img
          class="header__logo"
          src="<%=require('./images/logo.svg')%>"
          alt="Logo"
        />
      </header>
      <main class="content">
        <section class="profile">
          <div class="profile__image_container">
          <img
            class="profile__image"
            src="<%=require('./images/Avatar.png')%>"
            alt="profile-photo"
          />
          <img class="profile__image_edit-icon" 
          src="<%=require('./images/update-Avatar.svg')%>"
          alt="avatar-edit-icon"/>
        </div>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button class="profile__edit-button" type="button"></button>
            <p class="profile__description"></p>
          </div>
          <button class="profile__add-button" type="button"></button>
        </section>
        <section class="cards">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">© 2022 Around The U.S.</p>
      </footer>
    </div>

    <div class="modal" id="edit-profile">
      <div class="modal__container">
        <button class="modal__exit-button"></button>
        <h1 class="modal__header">Edit Profile</h1>
        <form class="modal__form">
          <label class="modal__label">
            <input
              class="modal__input"
              type="text"
              name="title"
              id="modalTitle"
              placeholder="Name"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="modal__error" id="modalTitle-error"></span>
          </label>
          <label class="modal__label">
            <input
              class="modal__input"
              type="text"
              name="description"
              id="modalDescription"
              placeholder="Description"
              minlength="2"
              maxlength="200"
              required
            />
            <span class="modal__error" id="modalDescription-error"></span>
          </label>
          <button type="submit" class="modal__save-button" disabled>
            Save
          </button>
        </form>
      </div>
    </div>

    <div class="modal" id="add-place">
      <div class="modal__container">
        <button class="modal__exit-button" id="exit-button"></button>
        <h1 class="modal__header">New Place</h1>
        <form class="modal__form" id="add-place-form">
          <label class="modal__label">
            <input
              class="modal__input"
              type="text"
              name="name"
              id="modal-title"
              placeholder="Title"
              required
            />
            <span class="modal__error" id="modal-title-error"></span>
          </label>
          <label class="modal__label">
            <input
              class="modal__input"
              type="url"
              name="link"
              id="modal-description"
              placeholder="Image URL"
              required
            />
            <span class="modal__error" id="modal-description-error"></span>
          </label>
          <button type="submit" class="modal__save-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="image-modal">
      <div class="modal__container_image">
        <button
          class="modal__exit-button modal__exit-button_image"
          id="image-exit-button"
        ></button>
        <img class="modal__image" src="" />
        <p class="modal__description"></p>
      </div>
    </div>

    <div class="modal" id="update-avatar">
      <div class="modal__container">
        <button class="modal__exit-button" id="exit-button"></button>
        <h1 class="modal__header">Change profile picture</h1>
        <form class="modal__form" id="update-avatar-form">
          <label class="modal__label">
            <input
              class="modal__input"
              type="url"
              name="link"
              id="modal-avatar"
              placeholder="Image URL"
              required
            />
            <span class="modal__error" id="modal-description-error"></span>
          </label>
          <button type="submit" class="modal__save-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="confirm-modal">
      <div class="modal__container">
        <button class="modal__exit-button" id="exit-button"></button>
        <h1 class="modal__header">Are you sure?</h1>
          <button type="submit" class="modal__save-button">Yes</button>
        </form>
      </div>
    </div>

    <template id="card-template">
      <li class="card">
        <button class="card__delete-button" type="button"></button>
        <img alt="" class="card__image" src="" />
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button class="card__like-button" type="button"></button>
        </div>
      </li>
    </template>
  </body>
</html>
